<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FF7100" />
  <meta name="description" content="DYPOL Creator Console — make, check and publish YouTube videos. By DYPOL LABS." />
  <meta name="product" content="DYPOL Creator Console" />
  <meta name="author" content="DYPOL LABS" />
  <title>DYPOL Creator Console</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF7100'/%3E%3Cpath d='M12 9.5v13l11-6.5z' fill='%23fff'/%3E%3C/svg%3E" />
  <script src="/assets/js/theme.js"></script>
  <link rel="stylesheet" href="/assets/css/app.css" />
</head>
<body>
  <!-- ============ Login ============ -->
  <div id="login-root" class="login" hidden>
    <button class="icon-btn theme-toggle theme-toggle--float" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode" title="Dark mode">
          <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
    <form class="login__card" id="login-form" autocomplete="off">
      <div class="login__logo">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5z" fill="#fff"/></svg>
        </div>
        <div>
          <h1>DYPOL Creator Console</h1>
          <div class="sub" style="margin-top:1px">by DYPOL LABS</div>
        </div>
      </div>
      <p class="sub login__lead">Make videos, check them, and publish them to YouTube — all from here.</p>
      <div class="stack" style="margin-top:20px; gap:14px">
        <div class="field">
          <label class="field__label" for="login-password">Password</label>
          <input class="input input--lg" type="password" id="login-password" name="password" required
                 placeholder="Your console password" autocomplete="current-password" />
          <div class="field__hint" id="login-hint"></div>
        </div>
        <label class="remember" for="login-remember">
          <input type="checkbox" id="login-remember" name="remember" />
          <span>Keep me signed in <span class="muted">(30 days; otherwise 7)</span></span>
        </label>
        <button class="btn btn--primary btn--xl btn--block" type="submit" id="login-submit">
          Sign in
        </button>
        <div class="callout" id="login-error" hidden></div>
      </div>
      <div class="footer-note" style="margin-top:22px">
        <span>© 2026 DYPOL LABS</span>
      </div>
    </form>
  </div>

  <!-- ============ App shell ============ -->
  <div id="app-root" class="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5z" fill="#fff"/></svg>
        </div>
        <div>
          <div class="brand-name">Creator Console</div>
          <div class="brand-sub">DYPOL LABS</div>
        </div>
      </div>
      <nav class="sidebar__nav" id="sidebar-nav" aria-label="Main navigation">
        <!-- filled by app.js -->
      </nav>
      <div class="sidebar__foot">
        <div class="ver">DYPOL Creator Console v2.0</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar__brand" aria-hidden="true">
          <div class="brand-mark brand-mark--sm"><svg viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l11-6.5z" fill="#fff"/></svg></div>
        </div>
        <div class="topbar__title" id="topbar-title">Home</div>
        <div class="topbar__spacer"></div>
        <div id="topbar-status"></div>
        <button class="icon-btn" id="btn-refresh" title="Refresh" aria-label="Refresh">
          <svg class="icon" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 5v6h-6"/></svg>
        </button>
        <button class="icon-btn theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode" title="Dark mode">
          <svg class="icon theme-toggle__moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon theme-toggle__sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="avatar" id="btn-avatar" title="Account" aria-label="Account menu" aria-haspopup="dialog">D</button>
      </header>

      <main class="page" id="page-root" tabindex="-1">
        <!-- routed page content -->
      </main>
    </div>

    <!-- Phone bottom tab bar -->
    <nav class="tabbar" id="tabbar" aria-label="Main tabs"></nav>
  </div>

  <!-- ============ Drawer (video details / run details) ============ -->
  <div class="scrim" id="drawer-scrim"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="drawer__head">
      <button class="icon-btn icon-btn--bare drawer__back" id="drawer-back" aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <h2 id="drawer-title">Details</h2>
      <div class="spacer"></div>
      <button class="icon-btn icon-btn--bare" id="drawer-close" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer__body" id="drawer-body"></div>
    <div class="drawer__foot" id="drawer-foot"></div>
  </aside>

  <!-- ============ Modal ============ -->
  <div class="modal-wrap" id="modal-wrap" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal__head"><h2 id="modal-title">Confirm</h2></div>
      <div class="modal__body" id="modal-body"></div>
      <div class="modal__foot" id="modal-foot"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
